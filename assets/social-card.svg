<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="title desc"><title id="title">Gregory's Awesome Teams — a teaching kit for the IBM Bob harness</title><desc id="desc">A social preview card. It reads "Gregory's Awesome Teams", a teaching kit for the IBM Bob harness, and "the thing it installs is the lesson". Four figures follow: 10 skills, 2 commands, 4 always-on rules, and demo day December 2026. Underneath is the six-stage build chain — discover, grill, spec, implement, evals, demo — and the line "Created by Gregory Kennedy for his awesome University Student Developers".</desc><defs><pattern id="hatch-blue" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#152a3a"/><line x1="0" y1="0" x2="0" y2="7" stroke="#1d3f5c" stroke-width="3.2"/></pattern><pattern id="hatch-green" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#152c1a"/><line x1="0" y1="0" x2="0" y2="7" stroke="#1f4a2a" stroke-width="3.2"/></pattern><pattern id="hatch-orange" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#2e1b06"/><line x1="0" y1="0" x2="0" y2="7" stroke="#4d2f08" stroke-width="3.2"/></pattern><pattern id="hatch-red" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#361f1f"/><line x1="0" y1="0" x2="0" y2="7" stroke="#5a2c2c" stroke-width="3.2"/></pattern></defs><style>text{font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Helvetica,Arial,sans-serif}</style><rect width="1280" height="640" fill="#121212"/><rect x="14" y="14" width="1252" height="612" rx="20" fill="none" stroke="#242424" stroke-width="2"/><rect x="72" y="72" width="96" height="7" rx="3.5" fill="#56a2e8"/><text x="72" y="116" font-size="21" fill="#a3a3a3" text-anchor="start" font-weight="600" letter-spacing="3.4">PROMPT · CONTEXT · HARNESS ENGINEERING</text><text x="72" y="232" font-size="72" fill="#ffffff" text-anchor="start" font-weight="700">Gregory's Awesome Teams</text><text x="72" y="290" font-size="29" fill="#d3d3d3" text-anchor="start">A teaching kit for the IBM Bob harness.</text><text x="72" y="328" font-size="29" fill="#a3a3a3" text-anchor="start">The thing it installs is the lesson.</text><g data-chip="0"><rect x="72.0" y="420" width="104.1" height="74" rx="12" fill="url(#hatch-blue)" stroke="#56a2e8" stroke-width="1.8"/><text x="124.05" y="454" font-size="30" fill="#ffffff" text-anchor="middle" font-weight="700">10</text><text x="124.05" y="477" font-size="17" fill="#a3a3a3" text-anchor="middle">skills</text></g><g data-chip="1"><rect x="192.1" y="420" width="122.8" height="74" rx="12" fill="url(#hatch-green)" stroke="#3a9a4b" stroke-width="1.8"/><text x="253.5" y="454" font-size="30" fill="#ffffff" text-anchor="middle" font-weight="700">2</text><text x="253.5" y="477" font-size="17" fill="#a3a3a3" text-anchor="middle">commands</text></g><g data-chip="2"><rect x="330.9" y="420" width="188.3" height="74" rx="12" fill="url(#hatch-orange)" stroke="#b86101" stroke-width="1.8"/><text x="425.025" y="454" font-size="30" fill="#ffffff" text-anchor="middle" font-weight="700">4</text><text x="425.025" y="477" font-size="17" fill="#a3a3a3" text-anchor="middle">always-on rules</text></g><g data-chip="3"><rect x="535.1" y="420" width="313.2" height="74" rx="12" fill="url(#hatch-blue)" stroke="#56a2e8" stroke-width="1.8"/><text x="691.75" y="454" font-size="30" fill="#ffffff" text-anchor="middle" font-weight="700">December 2026</text><text x="691.75" y="477" font-size="17" fill="#a3a3a3" text-anchor="middle">demo day</text></g><text x="72" y="524" font-size="19" fill="#a3a3a3" text-anchor="start" letter-spacing="0.6">discover  →  grill  →  spec  →  implement  →  evals  →  demo</text><line x1="72" y1="552" x2="1208" y2="552" stroke="#242424" stroke-width="1.6"/><text x="72" y="582" font-size="18" fill="#a3a3a3" text-anchor="start">Created by Gregory Kennedy for his awesome University Student Developers</text></svg>
