<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 188" width="1000" height="188" role="img" aria-labelledby="title desc"><title id="title">discover, grill, spec, implement, evals, demo rehearsal</title><desc id="desc">An animated strip of the six build stages in order: discover, grill, spec, implement, evals and demo rehearsal. The whole chain is visible throughout; a highlight walks along it and, for each stage in turn, one line underneath says what that stage is for and which skill runs it — check the idea against the real world, get interviewed until the plan is sharp, write down what done means, build it test-first one criterion at a time, measure the AI part instead of hoping, and break it on purpose before the audience does.</desc><defs><pattern id="hatch-blue" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#152a3a"/><line x1="0" y1="0" x2="0" y2="7" stroke="#1d3f5c" stroke-width="3.2"/></pattern><pattern id="hatch-green" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#152c1a"/><line x1="0" y1="0" x2="0" y2="7" stroke="#1f4a2a" stroke-width="3.2"/></pattern><pattern id="hatch-orange" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#2e1b06"/><line x1="0" y1="0" x2="0" y2="7" stroke="#4d2f08" stroke-width="3.2"/></pattern><pattern id="hatch-red" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#361f1f"/><line x1="0" y1="0" x2="0" y2="7" stroke="#5a2c2c" stroke-width="3.2"/></pattern></defs><style>text{font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Helvetica,Arial,sans-serif}@keyframes f0{0%,16.476%{opacity:0}17.905%,96.000%{opacity:1}97.429%,100%{opacity:0}}.f0{animation:f0 70s linear infinite both;}@keyframes w1{0%,16.476%{stroke-dashoffset:29;opacity:1}17.619%,96.000%{stroke-