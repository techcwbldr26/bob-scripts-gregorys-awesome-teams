<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 578" width="1000" height="578" role="img" aria-labelledby="title desc"><title id="title">Five layers from proof of concept to production</title><desc id="desc">An animated diagram of five layers to work through before an AI agent goes from a proof of concept to something people depend on. They build from the bottom up: the business case, the workflow, access, governance and security, and measurement — each answered by the one beneath it. A band is then drawn up through all five, labelled governance and security, with connectors into every layer, to make the point that security is not the fourth step but runs through all of them from the beginning.</desc><defs><pattern id="hatch-blue" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#152a3a"/><line x1="0" y1="0" x2="0" y2="7" stroke="#1d3f5c" stroke-width="3.2"/></pattern><pattern id="hatch-green" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#152c1a"/><line x1="0" y1="0" x2="0" y2="7" stroke="#1f4a2a" stroke-width="3.2"/></pattern><pattern id="hatch-orange" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#2e1b06"/><line x1="0" y1="0" x2="0" y2="7" stroke="#4d2f08" stroke-width="3.2"/></pattern><pattern id="hatch-red" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#361f1f"/><line x1="0" y1="0" x2="0" y2="7" stroke="#5a2c2c" stroke-width="3.2"/></pattern></defs><style>text{font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Helvetica,Arial,sans-serif}@keyframes f0{0%,5.143%{opacity:0;transform:translateY(12px)}6.571%,95.429%{opacity:1;transform:translateY(0)}96.857%,100%{opacity:0}}.f0{animation:f0 70s linear infinite both;}@keyframes p1{0%,5.143%{stroke-width:1;opacity:0}6.857%{stroke-width:2.6;opacity:0.95}8.571%{stroke-width:1;opacity:0.35}10.286%{stroke-width:2.6;opacity:0.95}12.000%{stroke-width:1;opacity:0.35}13.714%{stroke-width:2.6;opacity:0.95}15.429%{stroke-width:1;opacity:0.35}17.143%{stroke-width:2.6;opacity:0.95}18.571%{stroke-width:1;opacity:0.35}19.714%,100%{opacity:0;stroke-width:1}}.p1{animation:p1 70s linear infinite both;}@keyframes f2{0%,19.714%{opacity:0;transform:translateY(12px)}21.143%,95.429%{opacity:1;transform:translateY(0)}96.857%,100%{opacity:0}}.f2{animation:f2 70s linear infinite both;}@keyframes p3{0%,19.714%{stroke-width:1;opacity:0}21.429%{stroke-width:2.6;opacity:0.95}23.143%{stroke-width:1;opacity:0.35}24.857%{stroke-width:2.6;opacity:0.95}26.571%{stroke-width:1;opacity:0.35}28.286%{stroke-width:2.6;opacity:0.95}30.000%{stroke-width:1;opacity:0.35}31.714%{stroke-width:2.6;opacity:0.95}33.143%{stroke-width:1;opacity:0.35}34.286%,100%{opacity:0;stroke-width:1}}.p3{animation:p3 70s linear infinite both;}@keyframes f4{0%,34.286%{opacity:0;transform:translateY(12px)}35.714%,95.429%{opacity:1;transform:translateY(0)}96.857%,100%{opacity:0}}.f4{animation:f4 70s linear infinite both;}@keyframes p5{0%,34.286%{stroke-width:1;opacity:0}36.000%{stroke-width:2.6;opacity:0.95}37.714%{stroke-width:1;opacity:0.35}39.429%{stroke-width:2.6;opacity:0.95}41.143%{stroke-width:1;opacity:0.35}42.857%{stroke-width:2.6;opacity:0.95}44.571%{stroke-width:1;opacity:0.35}46.286%{stroke-width:2.6;opacity:0.95}47.714%{stroke-width:1;opacity:0.35}48.857%,100%{opacity:0;stroke-width:1}}.p5{animation:p5 70s linear infinite both;}@keyframes f6{0%,48.857%{opacity:0;transform:translateY(12px)}50.286%,95.429%{opacity:1;transform:translateY(0)}96.857%,100%{opacity:0}}.f6{animation:f6 70s linear infinite both;}@keyframes p7{0%,48.857%{stroke-width:1;opacity:0}50.571%{stroke-width:2.6;opacity:0.95}52.286%{stroke-width:1;opacity:0.35}54.000%{stroke-width:2.6;opacity:0.95}55.714%{stroke-width:1;opacity:0.35}57.429%{stroke-width:2.6;opacity:0.95}59.143%{stroke-width:1;opacity:0.35}60.857%{stroke-width:2.6;opacity:0.95}62.286%{stroke-width:1;opacity:0.35}63.429%,100%{opacity:0;stroke-width:1}}.p7{animation:p7 70s linear infinite both;}@keyframes f8{0%,63.429%{opacity:0;transform:translateY(12px)}64.857%,95.429%{opacity:1;transform:translateY(0)}96.857%,100%{opacity:0}}.f8{animation:f8 70s linear infinite both;}@keyframes p9{0%,63.429%{stroke-width:1;opacity:0}65.143%{stroke-width:2.6;opacity:0.95}66.857%{stroke-width:1;opacity:0.35}68.571%{stroke-width:2.6;opacity:0.95}70.286%{stroke-width:1;opacity:0.35}72.000%{stroke-width:2.6;opacity:0.95}73.714%{stroke-width:1;opacity:0.35}75.429%{stroke-width:2.6;opacity:0.95}76.857%{stroke-width:1;opacity:0.35}78.000%,100%{opacity:0;stroke-width:1}}.p9{animation:p9 70s linear infinite both;}@keyframes w10{0%,73.143%{stroke-dashoffset:360;opacity:1}77.714%,95.429%{stroke-dashoffset:0;opacity:1}96.857%,100%{stroke-dashoffset:360;opacity:0}}.w10{stroke-dasharray:360;stroke-dashoffset:360;animation:w10 70s linear infinite both;}@keyframes f11{0%,76.000%{opacity:0}77.429%,95.429%{opacity:1}96.857%,100%{opacity:0}}.f11{animation:f11 70s linear infinite both;}@keyframes w12{0%,76.571%{stroke-dashoffset:28;opacity:1}77.714%,95.429%{stroke-dashoffset:0;opacity:1}96.857%,100%{stroke-dashoffset:28;opacity:0}}.w12{stroke-dasharray:28;stroke-dashoffset:28;animation:w12 70s linear infinite both;}@keyframes w13{0%,76.914%{stroke-dashoffset:28;opacity:1}78.057%,95.429%{stroke-dashoffset:0;opacity:1}96.857%,100%{stroke-dashoffset:28;opacity:0}}.w13{stroke-dasharray:28;stroke-dashoffset:28;animation:w13 70s linear infinite both;}@keyframes w14{0%,77.257%{stroke-dashoffset:28;opacity:1}78.400%,95.429%{stroke-dashoffset:0;opacity:1}96.857%,100%{stroke-dashoffset:28;opacity:0}}.w14{stroke-dasharray:28;stroke-dashoffset:28;animation:w14 70s linear infinite both;}@keyframes w15{0%,77.600%{stroke-dashoffset:28;opacity:1}78.743%,95.429%{stroke-dashoffset:0;opacity:1}96.857%,100%{stroke-dashoffset:28;opacity:0}}.w15{stroke-dasharray:28;stroke-dashoffset:28;animation:w15 70s linear infinite both;}@keyframes w16{0%,77.943%{stroke-dashoffset:28;opacity:1}79.086%,95.429%{stroke-dashoffset:0;opacity:1}96.857%,100%{stroke-dashoffset:28;opacity:0}}.w16{stroke-dasharray:28;stroke-dashoffset:28;animation:w16 70s linear infinite both;}@keyframes f17{0%,79.429%{opacity:0;transform:translateY(6px)}80.857%,95.429%{opacity:1;transform:translateY(0)}96.857%,100%{opacity:0}}.f17{animation:f17 70s linear infinite both;}@media (prefers-reduced-motion:reduce){*{animation:none !important}.f0{opacity:1 !important}.p1{opacity:0 !important}.f2{opacity:1 !important}.p3{opacity:0 !important}.f4{opacity:1 !important}.p5{opacity:0 !important}.f6{opacity:1 !important}.p7{opacity:0 !important}.f8{opacity:1 !important}.p9{opacity:0 !important}.w10{stroke-dashoffset:0 !important;opacity:1 !important}.f11{opacity:1 !important}.w12{stroke-dashoffset:0 !important;opacity:1 !important}.w13{stroke-dashoffset:0 !important;opacity:1 !important}.w14{stroke-dashoffset:0 !important;opacity:1 !important}.w15{stroke-dashoffset:0 !important;opacity:1 !important}.w16{stroke-dashoffset:0 !important;opacity:1 !important}.f17{opacity:1 !important}}</style><rect width="1000" height="578" fill="#121212"/><text x="26" y="44" font-size="24" fill="#ffffff" text-anchor="start" font-weight="700">From proof of concept to production</text><text x="26" y="68" font-size="12.5" fill="#a3a3a3" text-anchor="start">Five layers between a demo that works and a system people can depend on.</text><text x="974" y="44" font-size="12" fill="#a3a3a3" text-anchor="end" letter-spacing="0.6">build upward</text><text x="974" y="68" font-size="12" fill="#6f6f6f" text-anchor="end">each layer answers the one below it</text><g class="f0"><rect x="196" y="414" width="780" height="64" rx="9" fill="url(#hatch-blue)" stroke="#56a2e8" stroke-width="1.7"/><text x="218" y="441" font-size="13" fill="#6f6f6f" text-anchor="start" font-weight="600">1</text><text x="240" y="441" font-size="15.5" fill="#ffffff" text-anchor="start" font-weight="700">Business case</text><text x="240" y="462" font-size="12.5" fill="#d3d3d3" text-anchor="start">What problem are we solving?</text><text x="956" y="462" font-size="11" fill="#a3a3a3" text-anchor="end">not “what can this tool do?”</text></g><rect x="192" y="410" width="788" height="72" rx="12" fill="none" stroke="#56a2e8" class="p1"/><g class="f2"><rect x="196" y="340" width="780" height="64" rx="9" fill="url(#hatch-blue)" stroke="#56a2e8" stroke-width="1.7"/><text x="218" y="367" font-size="13" fill="#6f6f6f" text-anchor="start" font-weight="600">2</text><text x="240" y="367" font-size="15.5" fill="#ffffff" text-anchor="start" font-weight="700">Workflow</text><text x="240" y="388" font-size="12.5" fill="#d3d3d3" text-anchor="start">Where does the agent enter, and where should it stop?</text><text x="956" y="388" font-size="11" fill="#a3a3a3" text-anchor="end">the goal is not to automate everything</text></g><rect x="192" y="336" width="788" height="72" rx="12" fill="none" stroke="#56a2e8" class="p3"/><g class="f4"><rect x="196" y="266" width="780" height="64" rx="9" fill="url(#hatch-green)" stroke="#3a9a4b" stroke-width="1.7"/><text x="218" y="293" font-size="13" fill="#6f6f6f" text-anchor="start" font-weight="600">3</text><text x="240" y="293" font-size="15.5" fill="#ffffff" text-anchor="start" font-weight="700">Access</text><text x="240" y="314" font-size="12.5" fill="#d3d3d3" text-anchor="start">What does it need, and what should it never touch?</text><text x="956" y="314" font-size="11" fill="#a3a3a3" text-anchor="end">the job it does, not the maximum the tool allows</text></g><rect x="192" y="262" width="788" height="72" rx="12" fill="none" stroke="#3a9a4b" class="p5"/><g class="f6"><rect x="196" y="192" width="780" height="64" rx="9" fill="url(#hatch-orange)" stroke="#b86101" stroke-width="1.7"/><text x="218" y="219" font-size="13" fill="#6f6f6f" text-anchor="start" font-weight="600">4</text><text x="240" y="219" font-size="15.5" fill="#ffffff" text-anchor="start" font-weight="700">Governance and security</text><text x="240" y="240" font-size="12.5" fill="#d3d3d3" text-anchor="start">What can it do alone, what needs approval, who is accountable?</text><text x="956" y="240" font-size="11" fill="#a3a3a3" text-anchor="end">not added after the workflow is built</text></g><rect x="192" y="188" width="788" height="72" rx="12" fill="none" stroke="#b86101" class="p7"/><g class="f8"><rect x="196" y="118" width="780" height="64" rx="9" fill="url(#hatch-green)" stroke="#3a9a4b" stroke-width="1.7"/><text x="218" y="145" font-size="13" fill="#6f6f6f" text-anchor="start" font-weight="600">5</text><text x="240" y="145" font-size="15.5" fill="#ffffff" text-anchor="start" font-weight="700">Measurement</text><text x="240" y="166" font-size="12.5" fill="#d3d3d3" text-anchor="start">How will you know it is creating value?</text><text x="956" y="166" font-size="11" fill="#a3a3a3" text-anchor="end">against the process it changes, not how it looks</text></g><rect x="192" y="114" width="788" height="72" rx="12" fill="none" stroke="#3a9a4b" class="p9"/><line x1="120" y1="478" x2="120" y2="118" stroke="url(#hatch-orange)" stroke-width="96" class="w10"/><g class="f11"><rect x="72" y="118" width="96" height="360" rx="10" fill="none" stroke="#b86101" stroke-width="1.8"/><g transform="rotate(-90 120 298)"><text x="120" y="303" font-size="13" fill="#b86101" text-anchor="middle" font-weight="700" letter-spacing="1.4">GOVERNANCE AND SECURITY</text></g></g><line x1="168" y1="446" x2="196" y2="446" stroke="#b86101" stroke-width="1.3" opacity="0.75" class="w12"/><line x1="168" y1="372" x2="196" y2="372" stroke="#b86101" stroke-width="1.3" opacity="0.75" class="w13"/><line x1="168" y1="298" x2="196" y2="298" stroke="#b86101" stroke-width="1.3" opacity="0.75" class="w14"/><line x1="168" y1="224" x2="196" y2="224" stroke="#b86101" stroke-width="1.3" opacity="0.75" class="w15"/><line x1="168" y1="150" x2="196" y2="150" stroke="#b86101" stroke-width="1.3" opacity="0.75" class="w16"/><g class="f17"><rect x="180" y="500" width="640" height="32" rx="16" fill="#191919" stroke="#b86101" stroke-width="1.2"/><text x="500" y="522" font-size="12.5" fill="#d3d3d3" text-anchor="middle">Security is not the fourth step. It runs through all five, from the beginning.</text></g><text x="500" y="560" font-size="10.5" fill="#6f6f6f" text-anchor="middle" letter-spacing="0.4">a technically impressive agent without a business case is still a poor investment</text></svg>
